[project]
name = "device-access-demo"
version = "0.1.0"
description = "Reusable Python examples for microphone, speaker, and camera access from the backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "opencv-python>=4.8.0",
]

[project.scripts]
list-devices = "devices.cli:list_all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devices"]
